[package]
name = "nextbot_creator"
version = "1.0.1"
edition = "2021"
description = "Simple Nextbot Creator for Garry's Mod, with animated GIF support"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "bmp"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
